name: ✨ Feature
description: Propose a straightforward extension of dbt functionality
title: "[Feature] <title>"
labels: ["enhancement", "triage", "type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: checkboxes
    attributes:
      label: Is this your first time submitting a feature request?
      description: >
        We want to make sure that features are distinct and discoverable,
        so that other members of the community can find them and offer their thoughts.

        Issues are the right place to request straightforward extensions of existing dbt functionality.
        For "big ideas" about future capabilities of dbt, we ask that you open a
        [discussion](https://github.com/dbt-labs/dbt/discussions) in the "Ideas" category instead.
      options:
        - label: I have read the [expectations for open source contributors](https://docs.getdbt.com/docs/contributing/oss-expectations)
          required: true
        - label: I have searched the existing issues, and I could not find an existing issue for this feature
          required: true
        - label: I am requesting a straightforward extension of existing dbt functionality, rather than a Big Idea better suited to a discussion
          required: true
  - type: dropdown
    id: version
    attributes:
      label: Which version of dbt is this feature for?
      description: >
        This helps us route the request. dbt v2.x covers the Core and Fusion distributions.
        A maintainer will apply the corresponding label after triage.
      options:
        - dbt v2.x (Core or Fusion)
        - dbt 1.x
        - Not sure / both
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Who will this benefit?
      description: |
        What kind of use case will this feature be useful for? Please be specific and provide examples, this will help us prioritize properly.
    validations:
      required: false
  - type: input
    attributes:
      label: Are you interested in contributing this feature?
      description: Let us know if you want to write some code, and how we can help.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the feature you are suggesting!
    validations:
      required: false

version: 2
updates:
  # main (Rust). Cargo/npm are managed upstream in dbt-labs/fs.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    rebase-strategy: "disabled"

  # 1.latest (Python)
  - package-ecosystem: "pip"
    directories: ["/", "/core"]
    target-branch: "1.latest"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "1.latest"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"

  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    target-branch: "1.latest"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    rebase-strategy: "disabled"

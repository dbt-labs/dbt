# **what?**
# Runs code quality checks, unit tests, integration tests and
# verifies python build on all code commited to the repository. This workflow
# should not require any secrets since it runs for PRs from forked repos. By
# default, secrets are not passed to workflows running from a forked repos.

# **why?**
# Ensure code for dbt meets a certain quality standard.

# **when?**
# This will run for all PRs, when code is pushed to a release
# branch, and when manually triggered.

name: Tests and Code Checks

on:
  push:
    branches:
      - "main"
      - "*.latest"
      - "releases/*"
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: read-all

# will cancel previous workflows triggered by the same event and for the same ref for PRs or same SHA otherwise
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ contains(github.event_name, 'pull_request') && github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# top-level adjustments can be made here
env:
  # number of parallel processes to spawn for python integration testing
  PYTHON_INTEGRATION_TEST_WORKERS: 15

jobs:
  code-quality:
    name: code-quality

    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HATCH_PYTHON: "3.11"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Install hatch"
        run: |
          # From PyPI: pypa/hatch@install curls a GitHub release asset with no retry,
          # and has been failing intermittently with "gzip: stdin: not in gzip format".
          python -m pip install hatch==1.18.2

      - name: Install python dependencies
        run: |
          cd core
          hatch -v run setup

      - name: Verify dbt installation
        run: |
          cd core
          hatch run dbt --version

      - name: Run pre-commit hooks
        run: |
          cd core
          hatch run code-quality

  unit:
    name: "unit test / python ${{ matrix.python-version }}"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      HATCH_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install hatch"
        run: |
          # From PyPI: pypa/hatch@install curls a GitHub release asset with no retry,
          # and has been failing intermittently with "gzip: stdin: not in gzip format".
          python -m pip install hatch==1.18.2

      - name: Run unit tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd core && hatch -v run ci:unit-tests

      - name: Get current date
        if: always()
        id: date
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%dT%H_%M_%S') # no colons allowed for artifacts
          echo "date=$CURRENT_DATE" >> $GITHUB_OUTPUT

      - name: Upload Unit Test Coverage to Codecov
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: false

  integration-metadata:
    name: integration test metadata generation
    runs-on: ubuntu-latest
    outputs:
      split-groups: ${{ steps.generate-split-groups.outputs.split-groups }}
      include: ${{ steps.generate-include.outputs.include }}

    steps:
      - name: generate split-groups
        id: generate-split-groups
        run: |
          MATRIX_JSON="["
          for B in $(seq 1 ${{ env.PYTHON_INTEGRATION_TEST_WORKERS }}); do
              MATRIX_JSON+=$(sed 's/^/"/;s/$/"/' <<< "${B}")
          done
          MATRIX_JSON="${MATRIX_JSON//\"\"/\", \"}"
          MATRIX_JSON+="]"
          echo "split-groups=${MATRIX_JSON}"
          echo "split-groups=${MATRIX_JSON}" >> $GITHUB_OUTPUT

      - name: generate include
        id: generate-include
        run: |
          # macOS is pinned to macos-15, not macos-latest: GitHub retired macos-14 (2026-11-02) and
          # macos-latest has moved to a newer image, so a fixed label keeps the image from changing under CI.
          INCLUDE=('"python-version":"3.11","os":"windows-latest"' '"python-version":"3.11","os":"macos-15"' )
          INCLUDE_GROUPS="["
          for include in "${INCLUDE[@]}"; do
              for group in $(seq 1 ${{ env.PYTHON_INTEGRATION_TEST_WORKERS }}); do
                  INCLUDE_GROUPS+=$(sed 's/$/, /' <<< "{\"split-group\":\"${group}\",${include}}")
              done
          done
          INCLUDE_GROUPS=$(echo $INCLUDE_GROUPS | sed 's/,*$//g')
          INCLUDE_GROUPS+="]"
          echo "include=${INCLUDE_GROUPS}"
          echo "include=${INCLUDE_GROUPS}" >> $GITHUB_OUTPUT

  integration-postgres:
    name: "(${{ matrix.split-group }}) integration test / python ${{ matrix.python-version }} / ${{ matrix.os }}"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs:
      - integration-metadata
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]
        split-group: ${{ fromJson(needs.integration-metadata.outputs.split-groups) }}
    env:
      HATCH_PYTHON: ${{ matrix.python-version }}
      DBT_INVOCATION_ENV: github-actions
      DBT_TEST_USER_1: dbt_test_user_1
      DBT_TEST_USER_2: dbt_test_user_2
      DBT_TEST_USER_3: dbt_test_user_3
      DD_CIVISIBILITY_AGENTLESS_ENABLED: ${{ secrets.DATADOG_API_KEY != '' }}
      DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      DD_SITE: datadoghq.com
      DD_ENV: ci
      DD_SERVICE: ${{ github.event.repository.name }}

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run postgres setup script
        run: |
          ./scripts/setup_db.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: password

      - name: "Install hatch"
        run: |
          # From PyPI: pypa/hatch@install curls a GitHub release asset with no retry,
          # and has been failing intermittently with "gzip: stdin: not in gzip format".
          python -m pip install hatch==1.18.2

      - name: Run integration tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          shell: bash
          command: cd core && hatch -v run ci:integration-tests -- ${{ secrets.DATADOG_API_KEY != '' && '--ddtrace' || '' }} --splits ${{ env.PYTHON_INTEGRATION_TEST_WORKERS }} --group ${{ matrix.split-group }}

      - name: Get current date
        if: always()
        id: date
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%dT%H_%M_%S') # no colons allowed for artifacts
          echo "date=$CURRENT_DATE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: logs_${{ matrix.python-version }}_${{ matrix.os }}_${{ matrix.split-group }}_${{ steps.date.outputs.date }}
          path: ./logs

      - name: Upload Integration Test Coverage to Codecov
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: false

  integration-mac-windows:
    name: (${{ matrix.split-group }}) integration test / python ${{ matrix.python-version }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs:
      - integration-metadata
    strategy:
      fail-fast: false
      matrix:
        # already includes split group and runs mac + windows
        include: ${{ fromJson(needs.integration-metadata.outputs.include) }}
    env:
      HATCH_PYTHON: ${{ matrix.python-version }}
      DBT_INVOCATION_ENV: github-actions
      DBT_TEST_USER_1: dbt_test_user_1
      DBT_TEST_USER_2: dbt_test_user_2
      DBT_TEST_USER_3: dbt_test_user_3
      DD_CIVISIBILITY_AGENTLESS_ENABLED: ${{ secrets.DATADOG_API_KEY != '' }}
      DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      DD_SITE: datadoghq.com
      DD_ENV: ci
      DD_SERVICE: ${{ github.event.repository.name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up postgres (macos)
        if: runner.os == 'macOS'

        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./scripts/setup_db.sh

      - name: Set up postgres (windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-postgres-windows

      - name: "Install hatch"
        run: |
          # From PyPI: pypa/hatch@install curls a GitHub release asset with no retry,
          # and has been failing intermittently with "gzip: stdin: not in gzip format".
          python -m pip install hatch==1.18.2

      - name: Run integration tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          shell: bash
          command: cd core && hatch -v run ci:integration-tests -- ${{ secrets.DATADOG_API_KEY != '' && '--ddtrace' || '' }} --splits ${{ env.PYTHON_INTEGRATION_TEST_WORKERS }} --group ${{ matrix.split-group }}

      - name: Get current date
        if: always()
        id: date
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%dT%H_%M_%S') # no colons allowed for artifacts
          echo "date=$CURRENT_DATE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: logs_${{ matrix.python-version }}_${{ matrix.os }}_${{ matrix.split-group }}_${{ steps.date.outputs.date }}
          path: ./logs

      - name: Upload Integration Test Coverage
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: false

  integration-report:
    if: ${{ always() }}
    name: Integration Test Suite
    runs-on: ubuntu-latest
    needs: [integration-mac-windows, integration-postgres]
    steps:
      - name: "Integration Tests Failed"
        if: ${{ contains(needs.integration-mac-windows.result, 'failure') || contains(needs.integration-mac-windows.result, 'cancelled') || contains(needs.integration-postgres.result, 'failure') || contains(needs.integration-postgres.result, 'cancelled') }}
        # when this is true the next step won't execute
        run: |
          echo "::notice title='Integration test suite failed'"
          exit 1

      - name: "Integration Tests Passed"
        run: |
          echo "::notice title='Integration test suite passed'"

  build:
    name: build packages

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Install hatch"
        run: |
          # From PyPI: pypa/hatch@install curls a GitHub release asset with no retry,
          # and has been failing intermittently with "gzip: stdin: not in gzip format".
          python -m pip install hatch==1.18.2

      - name: Install python dependencies
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --upgrade twine check-wheel-contents
          python -m pip --version

      - name: "Build Distributions"
        working-directory: core
        run: hatch build

      - name: "Show Distributions"
        working-directory: core
        run: ls -lh dist/

      - name: "Check and Verify Distributions"
        working-directory: core
        run: hatch -v run build:check-all

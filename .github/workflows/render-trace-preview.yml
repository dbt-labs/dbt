name: Render-trace preview wheel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-trace-preview.yml"
      - "crates/dbt-jinja/**"
      - "crates/dbt-jinja-utils/**"
      - "crates/dbt-sa-python/**"

permissions:
  contents: read

concurrency:
  group: render-trace-preview-${{ github.ref }}
  # Keep a usable artifact from an expensive cold build when the branch moves.
  cancel-in-progress: false

jobs:
  wheel:
    # Fork validation uses public dependencies, no upstream secrets or approval.
    # In the upstream repository this is a manual, opt-in preview build.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.fork }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install build tools
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          python -m pip install "maturin>=1,<2" patchelf pytest
          curl -fL --retry 3 -o protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  protoc.zip" | sha256sum --check
          unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE=$RUNNER_TEMP/protoc/include" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: render-trace-preview
      - name: Build release Python wheel
        run: >-
          python -m maturin build
          --manifest-path crates/dbt-sa-python/Cargo.toml
          --release --config profile.release.lto=false
          --compatibility manylinux_2_35
          --out dist
      - name: Validate installed trace exporter
        working-directory: crates/dbt-sa-python
        run: |
          python -m pip install ../../dist/*.whl
          python -m pytest tests/integration/test_render_trace.py -q
      - name: Record provenance and checksums
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("dist/producer.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["GITHUB_SHA"],
              "protocol_version": 1,
              "experimental": True,
              "platform": "Linux x86_64, glibc >= 2.35",
              "python": "CPython >= 3.10 (ABI3)",
          }, indent=2) + "\n")
          PY
          (cd dist && sha256sum *.whl > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-trace-python-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/producer.json
          if-no-files-found: error
          retention-days: 14

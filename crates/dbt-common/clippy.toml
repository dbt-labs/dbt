##
##       BIG FAT NOTE:
##
##                  This is the clippy configuration for the `dbt-schemas` crate.
##
##                  Clippy does *not* inherit configuration files in parent directories!!
##                  (https://github.com/rust-lang/rust-clippy/issues/7353) 
##                  This file overrides any clippy.toml further up in the directory
##                  structure and must be fully self-contained. Any shared
##                  configuration must be duplicated here and manually synced.
##
##

[[disallowed-methods]]
path = "arrow::compute::cast"
reason = """Default Arrow cast behavior is to swallow errors (safe: true). \
  Always use cast_with_options even if the default behavior is desired. \
  datafusion::common::format::DEFAULT_CAST_OPTIONS is a reasonable default for cast options."""

[[disallowed-methods]]
path = "std::fs::canonicalize"
reason = "Standard library canonicalize breaks Datafusion on Windows. Use dbt_common::stdfs::canonicalize instead."

[[disallowed-methods]]
path = "std::path::Path::canonicalize"
reason = "Standard library canonicalize breaks Datafusion on Windows. Use dbt_common::stdfs::canonicalize instead."

[[disallowed-methods]]
path = "std::env::set_var"
reason = "Did you forget to comment out `set_var(\"GOLDIE_UPDATE\", \"1\")`? This is used to ad-hoc update the golden files for a specific test in your local dev environment, but should not be committed to source control -- if you forget to remove it, it will essentially nullify the test in CI. Note: this lint is *only* meant to catch stray GOLDIE_UPDATE usages, if you're setting a different env var then you should exempt the statement by `#[allow(clippy::disallowed_methods)]`."

[[disallowed-types]]
path = "std::collections::HashMap"
reason = "Use dbt_common::collections::HashMap instead of std::collections::HashMap for deterministic and reproducible test baselines on debug builds."

[[disallowed-types]]
path = "std::collections::HashSet"
reason = "Use dbt_common::collections::HashSet instead of std::collections::HashSet for deterministic and reproducible test baselines on debug builds."

[[disallowed-types]]
path = "scc::HashMap"
reason = "Use dbt_common::collections::SccHashMap instead of scc::HashMap for deterministic and reproducible test baselines on debug builds."

# sqlparser's tree walk is generic over the visitor, so each call site with a
# new visitor or closure compiles a copy of the whole walk (~300 KiB per crate).
# `dbt_sqlparser_compat` compiles it once and takes a `dyn` visitor instead.
[[disallowed-methods]]
path = "sqlparser::ast::Visit::visit"
reason = "Each visitor type compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::visit` instead."

[[disallowed-methods]]
path = "sqlparser::ast::VisitMut::visit"
reason = "Each visitor type compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::visit_mut` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_expressions"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::exprs` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_expressions_mut"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::exprs::for_each_mut` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_relations"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::relations` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_relations_mut"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::visit_mut` with a `VisitorMut` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_statements"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::visit` with a `Visitor` instead."

[[disallowed-methods]]
path = "sqlparser::ast::visit_statements_mut"
reason = "Each closure compiles its own copy of sqlparser's tree walk. Use `dbt_sqlparser_compat::visit_mut` with a `VisitorMut` instead."

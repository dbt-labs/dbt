# Scenario: AWS Glue pinned to an explicit regional endpoint instead of the
# `endpoint_type` shortcut.
# Exercises: the Glue AUTHORIZATION_TYPE 'SIGV4' default (nothing else
# supplies it here) and an explicit `warehouse` winning over the ':' default.
catalogs:
  - name: glue_regional
    type: glue
    table_format: iceberg
    config:
      duckdb:
        endpoint: "glue.us-east-1.amazonaws.com/iceberg"
        warehouse: "123456789012"
        catalog_database: "glue_db"
        secret: glue_s3

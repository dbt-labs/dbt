    option (v1.public.common.vortex_namespace) = VORTEX_ICEBERG_NAMESPACE_TELEMETRY;

    v1.events.vortex.VortexMessageEnrichment enrichment = 1;

    v1.public.fields.vscode_types.Editor editor = 2;
    v1.public.fields.vscode_types.User user = 3;

    // the anonymous user id stored at ~/.dbt/.user.yml
    string dbt_local_cookie_user_id = 4;

    // md5 hash of the dbt project name (anonymized); identifies which project in
    // a multi-root workspace this event came from
    string project_id = 5;

    // the type of adapter used in the project (snowflake, bigquery, etc)
    string adapter_type = 6;

    v1.public.common.vortex_telemetry_contexts.VortexTelemetryCommonContext common_context = 7;
}


model.hello_world.incremental:
- sequence: 0
  type: execute
  sql: |-
    create or replace table `dbt-test-env`.`bigquery_incremental_simple`.`incremental__dbt_tmp`
    
    
    
    
    
    OPTIONS(
    description="""my table description\
    with multiple\
    lines\
    """,
    
    expiration_timestamp=TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 12 hour)
    )
    as (
    
    
    
    WITH source_data AS (SELECT * FROM `dbt-test-env`.`bigquery_incremental_simple`.`model_a` )
    
    
    
    SELECT id,
    field1,
    field2,
    field3,
    field4
    FROM source_data WHERE id NOT IN (SELECT id from `dbt-test-env`.`bigquery_incremental_simple`.`incremental` )
    
    
    );
- sequence: 1
  type: execute
  sql: |-
    alter table `dbt-test-env`.`bigquery_incremental_simple`.`incremental`
    
    
    add column `field3` INT64,
    
    add column `field4` STRING
- sequence: 2
  type: execute
  sql: |-
    -- back compat for old kwarg name
    
    
    
    
    
    
    
    
    
    
    
    
    merge into `dbt-test-env`.`bigquery_incremental_simple`.`incremental` as DBT_INTERNAL_DEST
    using (
    select
    * from `dbt-test-env`.`bigquery_incremental_simple`.`incremental__dbt_tmp`
    ) as DBT_INTERNAL_SOURCE
    on ((DBT_INTERNAL_SOURCE.id = DBT_INTERNAL_DEST.id))
    
    
    when matched then update set
    `id` = DBT_INTERNAL_SOURCE.`id`,`field1` = DBT_INTERNAL_SOURCE.`field1`,`field2` = DBT_INTERNAL_SOURCE.`field2`,`field3` = DBT_INTERNAL_SOURCE.`field3`,`field4` = DBT_INTERNAL_SOURCE.`field4`
    
    
    when not matched then insert
    (`id`, `field1`, `field2`, `field3`, `field4`)
    values
    (`id`, `field1`, `field2`, `field3`, `field4`)
- sequence: 3
  type: execute
  sql: ''
- sequence: 4
  type: execute
  sql: |-
    drop table if exists `dbt-test-env`.`bigquery_incremental_simple`.`incremental__dbt_tmp`

model.hello_world.model_a:
- sequence: 0
  type: execute
  sql: |-
    create or replace transient  table development.snowflake_custom_incremental.model_a
    
    
    
    
    as (
    
    
    with source_data as (
    
    select 1 as id, 'aaa' as field1, 'bbb' as field2, 111 as field3, 'TTT' as field4
    union all select 2 as id, 'ccc' as field1, 'ddd' as field2, 222 as field3, 'UUU' as field4
    )
    
    select id
    ,field1
    ,field2
    ,field3
    ,field4
    
    from source_data
    

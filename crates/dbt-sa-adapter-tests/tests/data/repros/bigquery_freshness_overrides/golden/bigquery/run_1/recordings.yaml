ab5bb41d:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    legacy.dataset_id AS table_schema,
    legacy.table_id AS table_name,
    IF(info.table_type = 'EXTERNAL', NULL, TIMESTAMP_MILLIS(legacy.last_modified_time)) AS last_altered,
    (legacy.type = 2) AS is_view
    FROM `dbt-test-env`.adapters_bigquery_metadata_source_freshness_overrides.__TABLES__ legacy
    LEFT JOIN `dbt-test-env`.adapters_bigquery_metadata_source_freshness_overrides.INFORMATION_SCHEMA.TABLES info
    ON info.table_schema = legacy.dataset_id
    AND info.table_name = legacy.table_id
    WHERE table_id = 'source_bulk'
source.test.adapters_bigquery_metadata_source_freshness_overrides_sources.source_field:
- sequence: 0
  type: execute
  sql: |-
    select
    max(updated_at) as max_loaded_at,
    current_timestamp() as snapshotted_at
    from `dbt-test-env`.`adapters_bigquery_metadata_source_freshness_overrides`.`source_field`
source.test.adapters_bigquery_metadata_source_freshness_overrides_sources.source_query:
- sequence: 0
  type: execute
  sql: |-
    with source_query as (
    select max(updated_at) from `dbt-test-env`.`adapters_bigquery_metadata_source_freshness_overrides`.`source_query`
    )
    select
    (select * from source_query) as max_loaded_at,
    current_timestamp() as snapshotted_at

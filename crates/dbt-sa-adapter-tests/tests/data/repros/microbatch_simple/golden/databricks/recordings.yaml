model.microbatch_simple.source_events:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_microbatch_simple'
- sequence: 1
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_microbatch_simple'
    AND table_name = 'source_events'
- sequence: 2
  type: execute
  sql: |-
    create or replace table `e2e`.`databricks_microbatch_simple`.`source_events`
    
    
    
    using delta
    
    
    
    
    
    
    
    
    
    
    as
    select cast('2025-01-01 12:00:00' as timestamp) as event_ts, 1 as id
    union all
    select cast('2025-01-02 12:00:00' as timestamp) as event_ts, 2 as id
    union all
    select cast('2025-01-03 12:00:00' as timestamp) as event_ts, 3 as id
    union all
    select cast('2025-01-04 12:00:00' as timestamp) as event_ts, 4 as id

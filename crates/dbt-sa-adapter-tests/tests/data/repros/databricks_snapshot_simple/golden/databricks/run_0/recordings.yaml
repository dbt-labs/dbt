523be9ba:
- sequence: 0
  type: execute
  sql: create schema if not exists `e2e`.`databricks_snapshot_simple`
85f3743c:
- sequence: 0
  type: execute
  sql: SHOW SCHEMAS IN `e2e`
model.hello_world.orders:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_snapshot_simple'
- sequence: 1
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_snapshot_simple'
    AND table_name = 'orders'
- sequence: 2
  type: execute
  sql: |-
    create or replace table `e2e`.`databricks_snapshot_simple`.`orders`
    
    
    
    using delta
    
    
    
    
    
    
    
    
    
    
    as
    -- Base orders table
    with source_data as (
    select 1 as id, 'pending' as status, cast('2025-01-01 09:00:00' as timestamp) as updated_at
    union all 
    select 2 as id, 'shipped' as status, cast('2025-01-01 09:00:00' as timestamp) as updated_at
    )
    
    select 
    id,
    status,
    updated_at
    from source_data

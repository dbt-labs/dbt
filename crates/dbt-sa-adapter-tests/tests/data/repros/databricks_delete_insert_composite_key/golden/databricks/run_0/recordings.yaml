41eaff4d:
- sequence: 0
  type: execute
  sql: create schema if not exists `e2e`.`databricks_delete_insert_composite_key`
85f3743c:
- sequence: 0
  type: execute
  sql: SHOW SCHEMAS IN `e2e`
model.hello_world.composite_incremental:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_delete_insert_composite_key'
    AND table_name = 'composite_incremental'
- sequence: 1
  type: execute
  sql: |-
    create or replace table `e2e`.`databricks_delete_insert_composite_key`.`composite_incremental`
    
    
    
    using delta
    
    
    
    
    
    
    
    
    
    
    as
    select id, region, value
    from `e2e`.`databricks_delete_insert_composite_key`.`source_data`
model.hello_world.source_data:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_delete_insert_composite_key'
- sequence: 1
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'databricks_delete_insert_composite_key'
    AND table_name = 'source_data'
- sequence: 2
  type: execute
  sql: |-
    create or replace table `e2e`.`databricks_delete_insert_composite_key`.`source_data`
    
    
    
    using delta
    
    
    
    
    
    
    
    
    
    
    as
    select 1 as id, 'us-east' as region, 100 as value
    union all select 2 as id, 'us-east' as region, 200 as value
    union all select 3 as id, 'us-west' as region, 300 as value

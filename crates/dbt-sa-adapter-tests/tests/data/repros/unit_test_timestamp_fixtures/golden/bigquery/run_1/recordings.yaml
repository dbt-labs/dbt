unit_test.unit_test_timestamp_fixtures.event_projection.csv_timezone_matches:
- sequence: 0
  type: execute
  sql: |-
    create or replace table `dbt-test-env`.`bigquery_unit_test_existing_parent_timestamp_fixtures`.`csv_timezone_matches__dbt_tmp`
    
    
    
    
    
    OPTIONS(
    expiration_timestamp=TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 12 hour)
    )
    as (
    select * from (
    SELECT
    id,
    event_timestamp,
    local_datetime,

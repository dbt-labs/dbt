    \t`dbt-test-env_bigquery_unit_test_existing_parent_timestamp_fixtures_event_projection_actual` as (SELECT
    id,
    event_timestamp,
    local_datetime,
    UNIX_MICROS(event_timestamp) AS utc_us,

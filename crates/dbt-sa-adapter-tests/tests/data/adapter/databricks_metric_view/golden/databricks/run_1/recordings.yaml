85f3743c:
- sequence: 0
  type: execute
  sql: SHOW SCHEMAS IN `e2e`
model.test.basic_metric_view:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_metric_view'
- sequence: 1
  type: execute
  sql: DESCRIBE TABLE EXTENDED `e2e`.`adapters_databricks_metric_view`.`basic_metric_view` AS JSON
- sequence: 2
  type: execute
  sql: |-
    create or replace view `e2e`.`adapters_databricks_metric_view`.`basic_metric_view`
    with metrics
    language yaml
    as $$
    version: 0.1
    source: "`e2e`.`adapters_databricks_metric_view`.`source_orders`"
    dimensions:
    - name: order_date
    expr: order_date
    - name: status
    expr: status
    measures:
    - name: total_orders
    expr: count(1)
    - name: total_revenue
    expr: sum(revenue)
    $$

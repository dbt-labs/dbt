model.test.t_incremental:
- sequence: 0
  type: execute
  sql: DESCRIBE TABLE EXTENDED `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental` AS JSON
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary view `t_incremental__dbt_tmp` as
    select 1 as id
- sequence: 2
  type: execute
  sql: |-
    SELECT column_name
    FROM `e2e`.`information_schema`.`columns`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND table_name = 't_incremental'
    AND is_nullable = 'NO'
- sequence: 3
  type: execute
  sql: |-
    SELECT kcu.constraint_name, kcu.column_name
    FROM `e2e`.information_schema.key_column_usage kcu
    WHERE kcu.table_catalog = 'e2e'
    AND kcu.table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND kcu.table_name = 't_incremental'
    AND kcu.constraint_name = (
    SELECT constraint_name
    FROM `e2e`.information_schema.table_constraints
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND table_name = 't_incremental'
    AND constraint_type = 'PRIMARY KEY'
    )
    ORDER BY kcu.ordinal_position
- sequence: 4
  type: execute
  sql: |-
    SELECT
    kcu.constraint_name,
    kcu.column_name AS from_column,
    ukcu.table_catalog AS to_catalog,
    ukcu.table_schema AS to_schema,
    ukcu.table_name AS to_table,
    ukcu.column_name AS to_column
    FROM `e2e`.information_schema.key_column_usage kcu
    JOIN `e2e`.information_schema.referential_constraints rc
    ON kcu.constraint_name = rc.constraint_name
    JOIN `e2e`.information_schema.key_column_usage ukcu
    ON rc.unique_constraint_name = ukcu.constraint_name
    AND kcu.ordinal_position = ukcu.ordinal_position
    WHERE kcu.table_catalog = 'e2e'
    AND kcu.table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND kcu.table_name = 't_incremental'
    AND kcu.constraint_name IN (
    SELECT constraint_name
    FROM `e2e`.information_schema.table_constraints
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND table_name = 't_incremental'
    AND constraint_type = 'FOREIGN KEY'
    )
    ORDER BY kcu.ordinal_position
- sequence: 5
  type: execute
  sql: |-
    SELECT
    column_name,
    mask_name,
    using_columns
    FROM `system`.`information_schema`.`column_masks`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND table_name = 't_incremental'
- sequence: 6
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_use_materialization_v2_configs'
    AND table_name = 't_incremental'
- sequence: 7
  type: execute
  sql: SHOW TBLPROPERTIES `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental`
- sequence: 8
  type: execute
  sql: describe extended `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental`
- sequence: 9
  type: execute
  sql: |-
    ALTER 
    TABLE
    `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental` SET 
    tblproperties ('test_property' = 'test_value' 
    )
- sequence: 10
  type: execute
  sql: DESCRIBE TABLE EXTENDED `t_incremental__dbt_tmp` AS JSON
- sequence: 11
  type: execute
  sql: DESCRIBE TABLE EXTENDED `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental` AS JSON
- sequence: 12
  type: execute
  sql: |-
    insert into `e2e`.`adapters_databricks_use_materialization_v2_configs`.`t_incremental` by name
    select * from `t_incremental__dbt_tmp`

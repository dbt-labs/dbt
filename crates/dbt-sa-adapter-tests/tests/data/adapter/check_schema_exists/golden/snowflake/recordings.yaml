model.test.b:
- sequence: 0
  type: execute
  sql: USE DATABASE development
- sequence: 1
  type: execute
  sql: ' CREATE OR REPLACE SCHEMA adapters_snowflake_check_schema_exists'
- sequence: 2
  type: execute
  sql: |-
    select count(*)
    from development.INFORMATION_SCHEMA.schemata
    where upper(schema_name) = upper('adapters_snowflake_check_schema_exists')
    and upper(catalog_name) = upper('development')
- sequence: 3
  type: execute
  sql: |-
    select count(*)
    from development.INFORMATION_SCHEMA.schemata
    where upper(schema_name) = upper('nonexistent_schema')
    and upper(catalog_name) = upper('development')

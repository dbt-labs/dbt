    CREATE OR REPLACE MATERIALIZED VIEW adapters_bigquery_describe_relation_related.a
    PARTITION BY RANGE_BUCKET(user_id, GENERATE_ARRAY(0, 100, 10))
    CLUSTER BY user_id
    OPTIONS(
    enable_refresh=true,
    refresh_interval_minutes=30
    )
    AS SELECT user_id FROM adapters_bigquery_describe_relation_related.base_a
- sequence: 5
  type: execute
  sql: DROP TABLE IF EXISTS adapters_bigquery_describe_relation_related.base_b
- sequence: 6

    PARTITION BY event_date
    CLUSTER BY user_id
- sequence: 7
  type: execute
  sql: INSERT INTO adapters_bigquery_describe_relation_related.base_b SELECT CURRENT_DATE() as event_date, user_id FROM UNNEST(GENERATE_ARRAY(0, 99)) as user_id
- sequence: 8
  type: execute
  sql: |-
    CREATE OR REPLACE MATERIALIZED VIEW adapters_bigquery_describe_relation_related.b
    PARTITION BY event_date
    CLUSTER BY user_id
    OPTIONS(
    enable_refresh=true,
    refresh_interval_minutes=30

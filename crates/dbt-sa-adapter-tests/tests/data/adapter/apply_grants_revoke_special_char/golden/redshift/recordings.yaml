model.test.revoke_special_char:
- sequence: 0
  type: execute
  sql: DROP SCHEMA IF EXISTS adapters_redshift_apply_grants_revoke_special_char CASCADE
- sequence: 1
  type: execute
  sql: CREATE SCHEMA adapters_redshift_apply_grants_revoke_special_char
- sequence: 2
  type: execute
  sql: CREATE TABLE adapters_redshift_apply_grants_revoke_special_char.a (one int)
- sequence: 3
  type: execute
  sql: GRANT SELECT ON adapters_redshift_apply_grants_revoke_special_char.a TO dbt_test_user_1
- sequence: 4
  type: execute
  sql: GRANT SELECT ON adapters_redshift_apply_grants_revoke_special_char.a TO "test.user"
- sequence: 5
  type: execute
  sql: |-
    with privileges as (
    -- valid options per https://docs.aws.amazon.com/redshift/latest/dg/r_HAS_TABLE_PRIVILEGE.html
    select 'select' as privilege_type
    union all
    select 'insert' as privilege_type
    union all
    select 'update' as privilege_type
    union all
    select 'delete' as privilege_type
    union all
    select 'references' as privilege_type
    )
    select
    u.usename as grantee,
    p.privilege_type
    from pg_user u
    cross join privileges p
    where has_table_privilege(u.usename, '"ci"."adapters_redshift_apply_grants_revoke_special_char"."a"', privilege_type)
    and u.usename != current_user
    and not u.usesuper
- sequence: 6
  type: execute
  sql: "revoke select on \"ci\".\"adapters_redshift_apply_grants_revoke_special_char\".\"a\" from \"test.user\"\n    \n"

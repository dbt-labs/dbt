model.test.orders_merge:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: SHOW OBJECTS IN SCHEMA "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_CREATE_OR_ALTER" LIMIT 10000
- sequence: 2
  type: execute
  sql: show dynamic tables like 'ORDERS_MERGE' in schema "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_CREATE_OR_ALTER"
- sequence: 3
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders_merge__dbt_tmp
    as (
    select * from (
    
    
    select
    o.order_id,
    o.amount,
    o.METADATA$ACTION = 'DELETE' and not o.METADATA$ISUPDATE as is_deleted
    from development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders changes(information => DEFAULT) at(offset => 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 4
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders_merge__dbt_tmp
- sequence: 5
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders_merge__dbt_tmp cascade
- sequence: 6
  type: execute
  sql: |-
    create or alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders_merge ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2), "IS_DELETED" BOOLEAN)
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    scheduler = 'DISABLE'
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    select
    o.order_id,
    o.amount,
    o.METADATA$ACTION = 'DELETE' and not o.METADATA$ISUPDATE as is_deleted
    from development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders changes(information => DEFAULT) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched and coalesce(DBT_INTERNAL_SOURCE.is_deleted, false) then delete
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT", "IS_DELETED" = DBT_INTERNAL_SOURCE."IS_DELETED"
    when not matched and not coalesce(DBT_INTERNAL_SOURCE.is_deleted, false) then insert ("ORDER_ID", "AMOUNT", "IS_DELETED") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT", DBT_INTERNAL_SOURCE."IS_DELETED")
    )
- sequence: 7
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter.orders_merge refresh
- sequence: 8
  type: execute
  sql: use warehouse [MASKED_WH]

test.test.orders_merge_matches_source:
- sequence: 0
  type: execute
  sql: |-
    select
    count(*) as failures,
    count(*) != 0 as should_warn,
    count(*) != 0 as should_error
    from (
    
    
    -- After apply_changes and a refresh: order 1 updated, order 2 deleted, order 4 inserted.
    with expected as (
    select * from values (1, 10, 15.00, false), (3, 30, 30.00, false), (4, 40, 40.00, false)
    as t (order_id, customer_id, amount, is_deleted)
    ),
    
    actual as (
    select order_id, customer_id, amount, is_deleted from development.adapters_snowflake_custom_incremental_dynamic_table.orders_merge
    )
    
    (select 'missing' as problem, * from expected minus select 'missing', * from actual)
    union all
    (select 'unexpected' as problem, * from actual minus select 'unexpected', * from expected)
    
    
    
    ) dbt_internal_test
test.test.orders_transient_after_refresh:
- sequence: 0
  type: execute
  sql: |-
    select
    count(*) as failures,
    count(*) != 0 as should_warn,
    count(*) != 0 as should_error
    from (
    
    
    -- After apply_changes and a refresh. APPEND_ONLY changes carry inserts only, so the update of
    -- order 1 and the delete of order 2 are not seen: every order ever inserted, at its inserted amount.
    with expected as (
    select * from values (1, 10.00), (2, 20.00), (3, 30.00), (4, 40.00)
    as t (order_id, amount)
    ),
    
    actual as (
    select order_id, amount from development.adapters_snowflake_custom_incremental_dynamic_table.orders_transient
    )
    
    (select 'missing' as problem, * from expected minus select 'missing', * from actual)
    union all
    (select 'unexpected' as problem, * from actual minus select 'unexpected', * from expected)
    
    
    
    ) dbt_internal_test

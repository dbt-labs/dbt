- sequence: 3
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table.stock_merge__dbt_tmp
    as (
    select * from (
    
    
    -- Starts with a CTE, which a refresh body cannot: the merge must wrap it in a subquery.
    with stock_changes as (
    select
    s.warehouse_id,
    s.sku,
    s.quantity,
    s.METADATA$ACTION as change_action,
    s.METADATA$ISUPDATE as change_is_update
    from development.adapters_snowflake_custom_incremental_dynamic_table.stock changes(information => DEFAULT) at(offset => 0) as s
    )
    
    select
    warehouse_id,
    sku,
    quantity,
    change_action = 'DELETE' and not change_is_update as is_deleted
    from stock_changes
    qualify row_number() over (
    partition by warehouse_id, sku
    order by case when change_action = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 4
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table.stock_merge__dbt_tmp

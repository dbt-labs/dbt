model.test.orders_empty:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: SHOW OBJECTS IN SCHEMA "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE" LIMIT 10000
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table.orders_empty__dbt_tmp
    as (
    select * from (
    
    
    -- First built by `dbt run --empty`: the stored body reads zero rows until --full-refresh.
    select o.order_id, o.amount
    from (select * from development.adapters_snowflake_custom_incremental_dynamic_table.orders changes(information => DEFAULT) at(offset => 0) limit 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 3
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table.orders_empty__dbt_tmp
- sequence: 4
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table.orders_empty__dbt_tmp cascade
- sequence: 5
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table.orders_empty ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- First built by `dbt run --empty`: the stored body reads zero rows until --full-refresh.
    select o.order_id, o.amount
    from (select * from development.adapters_snowflake_custom_incremental_dynamic_table.orders changes(information => DEFAULT) limit 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT"
    when not matched then insert ("ORDER_ID", "AMOUNT") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT")
    )
- sequence: 6
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table.orders_empty refresh
- sequence: 7
  type: execute
  sql: use warehouse [MASKED_WH]

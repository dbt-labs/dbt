  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table.orders_merge__dbt_tmp
    as (
    select * from (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select
    o.order_id,
    o.customer_id,
    o.amount,

model.test.ci_attrs:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: SHOW OBJECTS IN SCHEMA "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_ATTRIBUTES" LIMIT 10000
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_attributes.ci_attrs__dbt_tmp
    as (
    select * from (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_attributes.orders changes(information => DEFAULT) at(offset => 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 3
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_attributes.ci_attrs__dbt_tmp
- sequence: 4
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_attributes.ci_attrs__dbt_tmp cascade
- sequence: 5
  type: execute
  sql: |-
    create or replace dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_attributes.ci_attrs ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2))
    target_lag = '1 hour'
    warehouse = [MASKED_WH]
    initialization_warehouse = [MASKED_WH]
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'ENABLE'
    
    with row access policy development.adapters_snowflake_custom_incremental_dynamic_table_attributes.rap on (order_id)
    
    with tag (development.adapters_snowflake_custom_incremental_dynamic_table_attributes.mytag = 'v1')
    
    cluster by (amount)
    
    copy grants
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_attributes.orders changes(information => DEFAULT) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT"
    when not matched then insert ("ORDER_ID", "AMOUNT") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT")
    )

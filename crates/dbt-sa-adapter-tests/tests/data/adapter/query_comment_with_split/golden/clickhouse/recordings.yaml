- sequence: 4
  type: execute
  sql: |-
    /* {"app": "dbt", "dbt_version": "2.0.0", "node_id": "model.test.a", "node_name": "a", "package_name": "test", "profile_name": "fusion_tests", "relation": {"database": "", "identifier": null, "schema": "adapters_clickhouse_query_comment_with_split"}, "resource_type": "model", "target_name": "clickhouse"} */
    WITH mv_sources AS ( SELECT name AS mv_name, database AS mv_database, any(as_select) AS mv_sql, any(replaceRegexpOne(create_table_query, '.*TO\\s+`\x3F([^`\\s(]+)`\x3F\\.`\x3F([^`\\s(]+)`\x3F.*', '\\1.\\2')) AS target_fqn FROM system.tables WHERE engine = 'MaterializedView' AND create_table_query LIKE '%TO %' GROUP BY mv_name, mv_database ) SELECT t.database AS table_database, t.name AS table_name, t.engine AS table_type, db.engine AS database_engine, toJSONString(arrayDistinct(groupArrayIf( map('schema', mv_sources.mv_database, 'name', mv_sources.mv_name, 'sql', mv_sources.mv_sql), mv_sources.mv_name != '' ))) AS mvs_pointing_to_it, if(max(position(substring(t.create_table_query, 1, position(t.create_table_query, ' TO ')), ' REFRESH ')) > 0, 'true', 'false') AS is_refreshable, if(max(position(substring(t.create_table_query, 1, position(t.create_table_query, ' TO ')), ' APPEND')) > 0, 'true', 'false') AS refreshable_append, 'false' AS is_on_cluster FROM system.tables AS t JOIN system.databases AS db ON t.database = db.name LEFT JOIN mv_sources ON mv_sources.target_fqn = concat(t.database, '.', t.name) WHERE t.database = 'adapters_clickhouse_query_comment_with_split' AND t.name = 'a' GROUP BY table_database, table_name, table_type, database_engine

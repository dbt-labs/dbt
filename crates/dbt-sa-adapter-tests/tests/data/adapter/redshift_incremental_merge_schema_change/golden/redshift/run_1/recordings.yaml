- sequence: 10
  type: execute
  sql: |-
    -- back compat for old kwarg name
    
    
    
    
    
    
    
    
    
    
    merge into "ci"."adapters_redshift_incremental_merge_schema_change"."target"
    using "target__dbt_tmp" as DBT_INTERNAL_SOURCE
    on ("ci"."adapters_redshift_incremental_merge_schema_change"."target".id > 0) and (
    DBT_INTERNAL_SOURCE.id = "ci"."adapters_redshift_incremental_merge_schema_change"."target".id
    )
    
    
    when matched then update set
    "id" = DBT_INTERNAL_SOURCE."id", 
    "name" = DBT_INTERNAL_SOURCE."name", 
    "amount" = DBT_INTERNAL_SOURCE."amount"
    
    
    
    when not matched then insert (
    "id", 
    "name", 
    "amount"
    
    )
    values (
    DBT_INTERNAL_SOURCE."id", 
    DBT_INTERNAL_SOURCE."name", 
    DBT_INTERNAL_SOURCE."amount"
    
    )

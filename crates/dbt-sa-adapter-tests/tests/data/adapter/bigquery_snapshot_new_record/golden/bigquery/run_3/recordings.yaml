- sequence: 7
  type: execute
  sql: |-
    merge into `dbt-test-env`.`adapters_bigquery_snapshot_new_record`.`snapshot_of_source` as DBT_INTERNAL_DEST
    using `dbt-test-env`.`adapters_bigquery_snapshot_new_record`.`snapshot_of_source__dbt_tmp` as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_SOURCE.dbt_scd_id = DBT_INTERNAL_DEST.dbt_scd_id
    
    when matched
    
    and DBT_INTERNAL_DEST.dbt_valid_to is null
    
    and DBT_INTERNAL_SOURCE.dbt_change_type in ('update', 'delete')
    then update
    set dbt_valid_to = DBT_INTERNAL_SOURCE.dbt_valid_to
    
    when not matched
    and DBT_INTERNAL_SOURCE.dbt_change_type = 'insert'
    then insert (`id`, `first_name`, `contact`, `tags`, `updated_at`, `dbt_updated_at`, `dbt_valid_from`, `dbt_valid_to`, `dbt_scd_id`, `dbt_is_deleted`)
    values (`id`, `first_name`, `contact`, `tags`, `updated_at`, `dbt_updated_at`, `dbt_valid_from`, `dbt_valid_to`, `dbt_scd_id`, `dbt_is_deleted`)
- sequence: 8

version: 2

seeds:
  - name: mixed_dtypes
    description: Mixed data types test with an implicit schema
  - name: mixed_dtypes_w_schema
    config:
      column_types:
        id: INT64
        first_name: STRING
        last_name: STRING
        created_at: TIMESTAMP
        birth_date: DATE
        is_cool: BOOL
        net_worth: NUMERIC
  - name: timestamps
    config:
      column_types:
        timestamp_without_timezone: DATETIME
        timestamp_text: DATETIME
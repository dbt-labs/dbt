seed.test.timestamps:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_seed_datatypes'
- sequence: 1
  type: execute
  sql: |-
    create  table `e2e`.`adapters_databricks_seed_datatypes`.`timestamps` (`timestamp_without_timezone` TIMESTAMP )
    
    

model.basic_materializations.trips_incremental:
- sequence: 0
  type: execute
  sql: |-
    create temporary table "trips_incremental__dbt_tmp"
    as
    (
    with __dbt__cte__trips_input as (


    select id, zone, trips from "adapters_redis_adbc_basic_materializations"."trips"
    )
    --EPHEMERAL-SELECT-WRAPPER-START
    select * from (


    -- Reprocess all three IDs on each run; the second build must not duplicate them.
    select id, zone, trips from __dbt__cte__trips_input
    --EPHEMERAL-SELECT-WRAPPER-END
    ) as trips_incremental
    )
- sequence: 1
  type: execute
  sql: |-
    delete from "adapters_redis_adbc_basic_materializations"."trips_incremental" as DBT_INTERNAL_DEST
    where (id) in (
    select distinct id
    from "trips_incremental__dbt_tmp" as DBT_INTERNAL_SOURCE
    )
- sequence: 2
  type: execute
  sql: |-
    insert into "adapters_redis_adbc_basic_materializations"."trips_incremental" ("id", "zone", "trips")
    (
    select "id", "zone", "trips"
    from "trips_incremental__dbt_tmp"
    )

test.basic_materializations.unique_trips_incremental_id.3f32c480a9:
- sequence: 0
  type: execute
  sql: |-
    select
    count(*) as failures,
    count(*) != 0 as should_warn,
    count(*) != 0 as should_error
    from (





    select
    id as unique_field,
    count(*) as n_records

    from "adapters_redis_adbc_basic_materializations"."trips_incremental"
    where id is not null
    group by id
    having count(*) > 1





    ) dbt_internal_test

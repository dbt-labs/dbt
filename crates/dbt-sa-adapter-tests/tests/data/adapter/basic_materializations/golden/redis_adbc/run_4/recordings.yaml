test.basic_materializations.assert_totals:
- sequence: 0
  type: execute
  sql: |-
    select
    count(*) as failures,
    count(*) != 0 as should_warn,
    count(*) != 0 as should_error
    from (

    select 'table_count' as failure
    where (select count(*) from "adapters_redis_adbc_basic_materializations"."trips_table") <> 3
    union all
    select 'view_count' as failure
    where (select count(*) from "adapters_redis_adbc_basic_materializations"."zone_totals") <> 2
    union all
    select 'view_total' as failure
    where coalesce((select sum(trips) from "adapters_redis_adbc_basic_materializations"."zone_totals"), 0) <> 6
    union all
    select 'incremental_count' as failure
    where (select count(*) from "adapters_redis_adbc_basic_materializations"."trips_incremental") <> 3
    union all
    select 'incremental_total' as failure
    where coalesce((select sum(trips) from "adapters_redis_adbc_basic_materializations"."trips_incremental"), 0) <> 6


    ) dbt_internal_test

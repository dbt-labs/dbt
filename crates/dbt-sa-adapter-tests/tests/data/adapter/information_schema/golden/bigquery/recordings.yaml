    CREATE OR REPLACE TABLE adapters_bigquery_information_schema.info_schema_test_table (
    id INT64,
    name STRING,
    created_at TIMESTAMP
    )
- sequence: 2
  type: execute
  sql: |-
    INSERT INTO adapters_bigquery_information_schema.info_schema_test_table VALUES
    (1, 'test', CURRENT_TIMESTAMP())
- sequence: 3
  type: execute
  sql: |-
    create or replace view `dbt-test-env`.`adapters_bigquery_information_schema`.`test_columns_info`
    OPTIONS()
    as -- Create a test table  
    
    
    
    
    
    
    -- Generate INFORMATION_SCHEMA.COLUMNS path using the relation.information_schema() method
    
    
    
    
    
    -- Query INFORMATION_SCHEMA.COLUMNS to get column details for our test table
    select 
    table_catalog,
    table_schema,
    table_name,
    column_name,
    data_type,
    ordinal_position,
    'Listed from ' || '`dbt-test-env`.adapters_bigquery_information_schema.INFORMATION_SCHEMA.COLUMNS' as source
    from `dbt-test-env`.adapters_bigquery_information_schema.INFORMATION_SCHEMA.COLUMNS
    where table_schema = 'adapters_bigquery_information_schema'
    and upper(table_name) = 'INFO_SCHEMA_TEST_TABLE'
    order by ordinal_position;

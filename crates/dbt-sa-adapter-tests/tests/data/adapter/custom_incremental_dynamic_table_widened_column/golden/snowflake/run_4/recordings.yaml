- sequence: 2
  type: execute
  sql: show dynamic tables like 'ORDERS_MERGE' in schema "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_WIDENED_COLUMN"
- sequence: 3
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders_merge__dbt_tmp
    as (
    select * from (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.note
    from development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders changes(information => DEFAULT) at(offset => 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 4
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders_merge__dbt_tmp
- sequence: 5
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders_merge__dbt_tmp cascade
- sequence: 6
  type: execute
  sql: |-
    create or alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders_merge ("ORDER_ID" NUMBER(38,0), "NOTE" character varying(32))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    scheduler = 'DISABLE'
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.note
    from development.adapters_snowflake_custom_incremental_dynamic_table_widened_column.orders changes(information => DEFAULT) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "NOTE" = DBT_INTERNAL_SOURCE."NOTE"
    when not matched then insert ("ORDER_ID", "NOTE") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."NOTE")
    )

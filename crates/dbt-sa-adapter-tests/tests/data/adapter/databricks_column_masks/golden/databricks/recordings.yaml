model.test.test_weird_mask:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_column_masks'
- sequence: 1
  type: execute
  sql: |-
    CREATE FUNCTION IF NOT EXISTS e2e.adapters_databricks_column_masks.weird_mask(
    password STRING,
    id STRING,
    literal STRING,
    num INT,
    bool_val BOOLEAN,
    null_val STRING,
    interval INTERVAL DAY
    )
    RETURNS STRING
    RETURN CONCAT(
    password, '-',
    id, '-',
    literal, '-',
    CAST(num AS STRING), '-',
    CAST(bool_val AS STRING), '-',
    COALESCE(null_val, 'NULL'), '-',
    CAST(interval AS STRING)
    )
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary view `test_weird_mask__dbt_tmp` as
    select
    'abc123' as id,
    'password123' as password
- sequence: 3
  type: execute

model.test.test_email_mask_inc:
- sequence: 0
  type: execute
  sql: |-
    CREATE FUNCTION IF NOT EXISTS e2e.adapters_databricks_column_masks.email_mask(value STRING)
    RETURNS STRING
    RETURN CONCAT(
    REPEAT('*', POSITION('@' IN value) - 1),
    SUBSTR(value, POSITION('@' IN value))
    )
- sequence: 1
  type: execute
  sql: |-
    CREATE FUNCTION IF NOT EXISTS e2e.adapters_databricks_column_masks.password_mask(
    password STRING,
    name STRING,
    literal_string STRING
    )
    RETURNS STRING
    RETURN CONCAT(
    '[', literal_string, '] ',
    name, ': ',
    LEFT(password, 1),
    REPEAT('*', LENGTH(password) - 2),
    RIGHT(password, 1)
    )
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary view `test_email_mask_inc__dbt_tmp` as
    select cast(1 as bigint) as id, 'hello' as name, 'john.doe@example.com' as email,
    'password123' as password
- sequence: 3
  type: execute
  sql: DESCRIBE TABLE EXTENDED `test_email_mask_inc__dbt_tmp` AS JSON
- sequence: 4
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_column_masks'
    AND table_name = 'test_email_mask_inc'
- sequence: 5
  type: execute
  sql: |-
    create or replace table `e2e`.`adapters_databricks_column_masks`.`test_email_mask_inc`
    
    (
    
    
    
    
    
    
    
    `id` bigint,
    
    
    
    
    
    
    
    `name` STRING,
    
    
    
    
    
    
    
    
    
    
    `email` STRING MASK email_mask,
    
    
    
    
    
    
    
    
    
    
    
    
    `password` STRING MASK password_mask USING COLUMNS (name, 'literal_string')
    
    
    
    )
    
    
    
    using delta
- sequence: 6
  type: execute
  sql: insert into `e2e`.`adapters_databricks_column_masks`.`test_email_mask_inc` by name select * from `test_email_mask_inc__dbt_tmp`

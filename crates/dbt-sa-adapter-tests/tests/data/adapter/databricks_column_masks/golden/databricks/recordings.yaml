    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_column_masks'
    AND table_name = 'test_weird_mask'
- sequence: 5
  type: execute
  sql: |-
    create or replace table `e2e`.`adapters_databricks_column_masks`.`test_weird_mask`
    
    (
    
    
    
    
    
    
    
    `id` string,
    
    
    
    
    
    
    
    
    
    
    
    
    `password` string MASK weird_mask USING COLUMNS (id, 'literal_string', 333, true, null, INTERVAL 2 DAYS)
    
    
    

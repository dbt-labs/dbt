name: test
version: 1.0.0
config-version: 2
profile: fusion_tests
flags:
  send_anonymous_usage_stats: false
on-run-end:
- '{{ assert_refresh_schedules(results) }}'
vars:
  mv_schedule:
    cron: 0 0 * * * ? *
  st_schedule:
    cron: 0 0 * * * ? *
  expected_mv: &id001
  - CRON '0 0 * * * ? *' AT TIME ZONE 'Etc/UTC'
  - CRON '0 0 * * * ? *' AT TIME ZONE 'UTC'
  expected_st: *id001
  change_policy: apply
  st_marker: changed

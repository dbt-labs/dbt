dbbbff64:
- sequence: 0
  type: execute
  sql: |-
    show terse schemas in database development
    limit 10000
model.my_project.base:
- sequence: 0
  type: execute
  sql: SHOW OBJECTS IN SCHEMA "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_DEBUG_SNAPSHOT_SIMPLE" LIMIT 10000
- sequence: 1
  type: execute
  sql: |-
    create or replace   view development.adapters_snowflake_debug_snapshot_simple.base
    
    
    
    

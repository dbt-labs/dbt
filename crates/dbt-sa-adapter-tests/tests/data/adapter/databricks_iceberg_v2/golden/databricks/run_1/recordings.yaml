model.test.managed:
- sequence: 0
  type: execute
  sql: DESCRIBE TABLE EXTENDED `e2e`.`adapters_databricks_iceberg_v2`.`managed` AS JSON
- sequence: 1
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `e2e`.`information_schema`.`row_filters`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_iceberg_v2'
    AND table_name = 'managed'
- sequence: 2
  type: execute
  sql: |-
    create or replace table `e2e`.`adapters_databricks_iceberg_v2`.`managed`
    
    
    
    
    using iceberg
    
    
    
    
    
    
    
    
    
    
    
    as
    select 1 as id, 'managed' as catalog_type

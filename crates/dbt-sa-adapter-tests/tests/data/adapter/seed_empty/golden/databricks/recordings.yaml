  type: execute
  sql: create schema if not exists `e2e`.`adapters_databricks_seed_empty`
85f3743c:
- sequence: 0
  type: execute
  sql: SHOW SCHEMAS IN `e2e`
seed.seed_empty.users:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_seed_empty'
- sequence: 1
  type: execute
  sql: |-
    create  table `e2e`.`adapters_databricks_seed_empty`.`users` (`id` bigint ,`first_name` string ,`last_name` string ,`salary` double ,`is_teacher` boolean )
    
    
    using delta

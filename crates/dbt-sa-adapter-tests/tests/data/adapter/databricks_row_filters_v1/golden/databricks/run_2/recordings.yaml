- sequence: 1
  type: execute
  sql: |-
    SELECT column_name
    FROM `e2e`.`information_schema`.`columns`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_row_filters_v1'
    AND table_name = 'row_filter_incremental'
    AND is_nullable = 'NO'
- sequence: 2
  type: execute
  sql: |-
    SELECT kcu.constraint_name, kcu.column_name
    FROM `e2e`.information_schema.key_column_usage kcu
    WHERE kcu.table_catalog = 'e2e'
    AND kcu.table_schema = 'adapters_databricks_row_filters_v1'
    AND kcu.table_name = 'row_filter_incremental'
    AND kcu.constraint_name = (
    SELECT constraint_name
    FROM `e2e`.information_schema.table_constraints
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_row_filters_v1'
    AND table_name = 'row_filter_incremental'
    AND constraint_type = 'PRIMARY KEY'
    )
    ORDER BY kcu.ordinal_position
- sequence: 3
  type: execute
  sql: |-
    SELECT
    kcu.constraint_name,
    kcu.column_name AS from_column,
    ukcu.table_catalog AS to_catalog,
    ukcu.table_schema AS to_schema,
    ukcu.table_name AS to_table,
    ukcu.column_name AS to_column
    FROM `e2e`.information_schema.key_column_usage kcu
    JOIN `e2e`.information_schema.referential_constraints rc
    ON kcu.constraint_name = rc.constraint_name
    JOIN `e2e`.information_schema.key_column_usage ukcu
    ON rc.unique_constraint_name = ukcu.constraint_name
    AND kcu.ordinal_position = ukcu.ordinal_position
    WHERE kcu.table_catalog = 'e2e'
    AND kcu.table_schema = 'adapters_databricks_row_filters_v1'
    AND kcu.table_name = 'row_filter_incremental'
    AND kcu.constraint_name IN (
    SELECT constraint_name
    FROM `e2e`.information_schema.table_constraints
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_row_filters_v1'
    AND table_name = 'row_filter_incremental'
    AND constraint_type = 'FOREIGN KEY'
    )
    ORDER BY kcu.ordinal_position

85f3743c:
- sequence: 0
  type: execute
  sql: SHOW SCHEMAS IN `e2e`
model.test.row_filter_incremental:
- sequence: 0
  type: execute
  sql: |-
    create or replace table `e2e`.`adapters_databricks_row_filters_v1`.`row_filter_incremental`
    
    
    
    using delta
    
    
    
    
    WITH ROW FILTER `e2e`.`adapters_databricks_row_filters_v1`.`region_filter` ON (`region`)
    
    
    
    
    
    as
    select 'user1' as user_id, 'region_a' as region, cast(100 as bigint) as amount
model.test.row_filter_table:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'e2e'
    AND table_schema = 'adapters_databricks_row_filters_v1'
- sequence: 1
  type: execute
  sql: |-
    create or replace table `e2e`.`adapters_databricks_row_filters_v1`.`row_filter_table`
    
    
    
    using delta
    
    
    
    
    WITH ROW FILTER `e2e`.`adapters_databricks_row_filters_v1`.`region_filter` ON (`region`)
    
    
    
    
    
    as
    select 'user1' as user_id, 'region_a' as region, cast(100 as bigint) as amount

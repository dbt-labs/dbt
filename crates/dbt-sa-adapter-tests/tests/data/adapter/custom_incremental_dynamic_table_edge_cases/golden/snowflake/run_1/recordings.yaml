  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.duplicate_keys__dbt_tmp
    as (
    select * from (
    
    
    -- No dedup per key: an update arrives as a DELETE and an INSERT of the same key, and the refresh
    -- fails with 002742 "Duplicate row detected".
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.orders changes(information => DEFAULT) at(offset => 0) as o
    ) limit 0
    )

- sequence: 4
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.duplicate_keys ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- No dedup per key: an update arrives as a DELETE and an INSERT of the same key, and the refresh
    -- fails with 002742 "Duplicate row detected".
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.orders changes(information => DEFAULT) as o
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT"
    when not matched then insert ("ORDER_ID", "AMOUNT") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT")
    )

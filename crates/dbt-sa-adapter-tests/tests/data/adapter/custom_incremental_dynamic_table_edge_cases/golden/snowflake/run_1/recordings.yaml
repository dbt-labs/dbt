model.test.over_replaced_table:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.over_replaced_table__dbt_tmp
    as (
    select * from (
    
    
    -- Reads stg_orders, a table model every dbt run replaces. The replacement's change history starts
    -- empty, so a refresh reads all its rows as inserts, and a row deleted upstream is never seen.
    select
    o.order_id,
    o.amount,
    o.METADATA$ACTION = 'DELETE' and not o.METADATA$ISUPDATE as is_deleted
    from development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.stg_orders changes(information => DEFAULT) at(offset => 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 2
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.over_replaced_table__dbt_tmp
- sequence: 3
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.over_replaced_table__dbt_tmp cascade
- sequence: 4
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.over_replaced_table ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2), "IS_DELETED" BOOLEAN)
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- Reads stg_orders, a table model every dbt run replaces. The replacement's change history starts
    -- empty, so a refresh reads all its rows as inserts, and a row deleted upstream is never seen.
    select
    o.order_id,
    o.amount,
    o.METADATA$ACTION = 'DELETE' and not o.METADATA$ISUPDATE as is_deleted
    from development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.stg_orders changes(information => DEFAULT) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched and coalesce(DBT_INTERNAL_SOURCE.is_deleted, false) then delete
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT", "IS_DELETED" = DBT_INTERNAL_SOURCE."IS_DELETED"
    when not matched and not coalesce(DBT_INTERNAL_SOURCE.is_deleted, false) then insert ("ORDER_ID", "AMOUNT", "IS_DELETED") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT", DBT_INTERNAL_SOURCE."IS_DELETED")
    )
- sequence: 5
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_edge_cases.over_replaced_table refresh
- sequence: 6
  type: execute
  sql: use warehouse [MASKED_WH]

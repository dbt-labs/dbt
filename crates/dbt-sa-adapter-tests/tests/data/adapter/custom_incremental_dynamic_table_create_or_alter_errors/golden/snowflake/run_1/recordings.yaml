model.test.err_reorder:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.err_reorder__dbt_tmp
    as (
    select * from (
    -- Evolved: the columns after order_id swap places, which CREATE OR ALTER can't do.
    select o.order_id, o.amount, o.note
    from development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.orders changes(information => DEFAULT) at(offset => 0) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 2
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.err_reorder__dbt_tmp
- sequence: 3
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.err_reorder__dbt_tmp cascade
- sequence: 4
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.err_reorder ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2), "NOTE" character varying(100))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    -- Evolved: the columns after order_id swap places, which CREATE OR ALTER can't do.
    select o.order_id, o.amount, o.note
    from development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.orders changes(information => DEFAULT) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT", "NOTE" = DBT_INTERNAL_SOURCE."NOTE"
    when not matched then insert ("ORDER_ID", "AMOUNT", "NOTE") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT", DBT_INTERNAL_SOURCE."NOTE")
    )
- sequence: 5
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_create_or_alter_errors.err_reorder refresh
- sequence: 6
  type: execute
  sql: use warehouse [MASKED_WH]

model.databricks_clone_governed_views.masked_st:
- sequence: 0
  type: execute
  sql: |-
    SELECT
    table_name,
    if(table_type IN ('EXTERNAL', 'MANAGED', 'MANAGED_SHALLOW_CLONE', 'EXTERNAL_SHALLOW_CLONE'), 'table', lower(table_type)) AS table_type,
    lower(data_source_format) AS file_format,
    table_schema,
    table_owner,
    table_catalog,
    if(
    table_type IN (
    'EXTERNAL',
    'MANAGED',
    'MANAGED_SHALLOW_CLONE',
    'EXTERNAL_SHALLOW_CLONE'
    ),
    lower(table_type),
    NULL
    ) AS databricks_table_type
    FROM `system`.`information_schema`.`tables`
    WHERE table_catalog = 'main'
    AND table_schema = 'adapters_databricks_clone_governed_views'
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary view `masked_st_prod__dbt_tmp` as
    select * from `main`.`adapters_databricks_clone_governed_views`.`column_mask_seed`
- sequence: 2
  type: execute
  sql: DESCRIBE TABLE EXTENDED `masked_st_prod__dbt_tmp` AS JSON
- sequence: 3
  type: execute
  sql: |-
    SELECT
    table_catalog,
    table_schema,
    table_name,
    filter_name,
    target_columns
    FROM `main`.`information_schema`.`row_filters`
    WHERE table_catalog = 'main'
    AND table_schema = 'adapters_databricks_clone_governed_views'
    AND table_name = 'masked_st_prod'
- sequence: 4
  type: execute
  sql: |-
    CREATE STREAMING TABLE `main`.`adapters_databricks_clone_governed_views`.`masked_st_prod`
    
    (
    
    
    
    
    
    
    
    `id` string,
    
    
    
    
    
    
    
    
    
    
    `password` string MASK password_mask
    
    
    
    )
    
    
    
    
    
    
    
    
    
    AS select * from stream `main`.`adapters_databricks_clone_governed_views`.`column_mask_seed`

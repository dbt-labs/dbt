model.test.orders_hand_written:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders_hand_written__dbt_tmp
    as (
    select * from (
    -- CHANGES written by hand after source(): discovery runs it as written (not under --empty).
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders changes(information => default) as o
    where o.METADATA$ACTION = 'INSERT'
    ) limit 0
    )
- sequence: 2
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders_hand_written__dbt_tmp
- sequence: 3
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders_hand_written__dbt_tmp cascade
- sequence: 4
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders_hand_written ("ORDER_ID" NUMBER(38,0), "AMOUNT" NUMBER(10,2))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    -- CHANGES written by hand after source(): discovery runs it as written (not under --empty).
    select o.order_id, o.amount
    from development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders changes(information => default) as o
    where o.METADATA$ACTION = 'INSERT'
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "AMOUNT" = DBT_INTERNAL_SOURCE."AMOUNT"
    when not matched then insert ("ORDER_ID", "AMOUNT") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."AMOUNT")
    )
- sequence: 5
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_changes_forms.orders_hand_written refresh
- sequence: 6
  type: execute
  sql: use warehouse [MASKED_WH]

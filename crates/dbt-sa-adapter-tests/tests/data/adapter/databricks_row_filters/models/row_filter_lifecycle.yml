version: 2
models:
  - name: row_filter_table
    config: &region_filter
      row_filter:
        function: region_filter
        columns: [region]
    columns: &columns
      - name: user_id
        data_type: string
      - name: region
        data_type: string
      - name: amount
        data_type: bigint

  - name: row_filter_incremental
    config: *region_filter
    columns: *columns

  - name: row_filter_materialized_view
    config: *region_filter
    columns: *columns

  - name: row_filter_safe_replace
    config: *region_filter
    columns: *columns

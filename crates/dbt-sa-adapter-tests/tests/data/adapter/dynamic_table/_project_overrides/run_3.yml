flags:
  send_anonymous_usage_stats: false
name: test
profile: fusion_tests

macro-paths: ["macros"]

models:
  test:
    +static_analysis: off

    initialization_warehouse:
      # test --full-refresh with init warehouse set (different from warehouse)
      init_wh:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +snowflake_initialization_warehouse: FUSION_SLT_WAREHOUSE

      # test --full-refresh without init warehouse
      no_init_wh:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour

      # test --full-refresh with init warehouse set
      same_wh:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +snowflake_initialization_warehouse: FUSION_SLT_WAREHOUSE

    initialize:
      # test --full-refresh with ON_CREATE (default)
      init_default:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour

      # test --full-refresh with ON_SCHEDULE
      init_on_schedule:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +initialize: ON_SCHEDULE

    target_lag:
      # test --full-refresh with specific lag
      lag:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour

    refresh_mode:
      # test --full-refresh with AUTO refresh mode
      refresh_auto:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour

      # test --full-refresh with FULL refresh mode
      refresh_full:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +refresh_mode: FULL

    cluster_by:
      # test --full-refresh with cluster_by
      dt_cluster_alter:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +cluster_by: [id]

      # test --full-refresh with cluster_by
      dt_cluster_drop:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +cluster_by: [id]

    transient:
      # test --full-refresh as transient dynamic table
      dt_transient1:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +transient: true

    copy_grants:
      # test --full-refresh with copy_grants: exercises CREATE OR REPLACE
      dt_copy_grants1:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +copy_grants: true

    immutable_where:
      # test --full-refresh with immutable_where clause
      dt_imw1:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +refresh_mode: INCREMENTAL
        +immutable_where: "id < 100"

    scheduler:
      # test --full-refresh with scheduler=DISABLE (no target_lag)
      scheduler_disable:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +scheduler: disable

      # test --full-refresh with scheduler=ENABLE (with target_lag)
      scheduler_enable:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 5 minutes
        +scheduler: enable

    iceberg:
      # test --full-refresh: forces `create or replace dynamic iceberg table`
      # (dynamic_table/replace.sql) for the managed-storage case — this is
      # the specific call site the sev0 review of PR #12395 flagged as
      # fixed-but-untested.
      dt_iceberg_managed:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +table_format: iceberg

      dt_iceberg_external_volume:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +table_format: iceberg
        +external_volume: s3_iceberg_snow
        +base_location_root: fs_test_user
        +base_location_subpath: ci

      dt_iceberg_explicit_snowflake_managed:
        +materialized: dynamic_table
        +snowflake_warehouse: FUSION_SLT_WAREHOUSE
        +target_lag: 1 hour
        +table_format: iceberg
        +external_volume: SNOWFLAKE_MANAGED
        +base_location_root: fs_test_user
        +base_location_subpath: ci

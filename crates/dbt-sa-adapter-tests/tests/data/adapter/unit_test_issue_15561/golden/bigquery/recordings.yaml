    SELECT
    3 AS user_id,
    "Charlie" AS name,
    ["music", "sports", "travel", "photography"] AS hobbies,
    [92, 89, 94, 87, 90] AS test_scores,
    [CAST('2024-01-10' AS DATE), CAST('2024-02-15' AS DATE), CAST('2024-03-05' AS DATE), CAST('2024-03-20' AS DATE)] AS activity_dates;

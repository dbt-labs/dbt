version: 2
models:
  - name: lc_table
    config: &user_cluster
      liquid_clustered_by: [user_id]
    columns: &columns
      - name: user_id
        data_type: string
      - name: region
        data_type: string
      - name: amount
        data_type: bigint

  - name: lc_incremental
    config: *user_cluster
    columns: *columns

  - name: lc_materialized_view
    config: *user_cluster
    columns: *columns

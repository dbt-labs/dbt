69668c6e:
- sequence: 0
  type: execute
  sql: create schema if not exists development.icebergBuiltinTestSchema
dbbbff64:
- sequence: 0
  type: execute
  sql: |-
    show terse schemas in database development
    limit 10000
model.test.builtin:
- sequence: 0
  type: execute
  sql: |-
    create or replace iceberg table development.icebergBuiltinTestSchema.builtin
    external_volume = 's3_iceberg_snow'
    
    catalog = 'SNOWFLAKE'  -- required, and always SNOWFLAKE for built-in Iceberg tables
    base_location = '_fusion_ci/yml/icebergBuiltinTestSchema/builtin'
    
    
    
    
    
    
    
    
    change_tracking = True
    
    
    
    
    
    
    as (
    
    select 'snorlax' as pokemon, 'rest' as move
    )

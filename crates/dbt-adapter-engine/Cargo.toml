[package]
name = "dbt-adapter-engine"
version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
dbt-adapter-core = { workspace = true }
dbt-adapter-sql = { workspace = true }
dbt-adbc = { workspace = true }
dbt-auth = { workspace = true }
dbt-cancel = { workspace = true }
dbt-common = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
dbt-runtime = { workspace = true }
dbt-schemas = { workspace = true }
dbt-yaml = { workspace = true }

adbc-core = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
minijinja = { workspace = true, features = ["loader", "deserialization"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracy-client = { workspace = true }

[dev-dependencies]
adbc-core = { workspace = true }
dbt-runtime = { workspace = true }
minijinja-contrib = { workspace = true, features = [
  "datetime",
  "timezone",
  "testing",
] }
tempfile = { workspace = true }

[lib]
name = "dbt_adapter_engine"
path = "src/lib.rs"
doctest = false

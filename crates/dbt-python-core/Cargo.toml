[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "dbt-python-core"
version.workspace = true

[dependencies]
dbt-base = { workspace = true }
dbt-clap-core = { workspace = true }
dbt-common = { workspace = true }
dbt-features = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
dbt-main = { workspace = true }
dbt-runtime = { workspace = true }
dbt-schemas = { workspace = true }
dbt-tracing = { workspace = true }
dbt-yaml = { workspace = true }
# abi3-py310 to match the distribution cdylibs; feature unification would apply it
# anyway, and stating it keeps a lone `cargo check -p dbt-python-core` honest.
pyo3 = { workspace = true, features = ["abi3-py310"] }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# LevelFilter, for the process-wide tracing verbosity ceiling.
tracing = { workspace = true }

[features]
embed-ui = ["dbt-main/embed-ui"]

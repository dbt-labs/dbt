[package]
name = "dbt-dist"
version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Distribution, install channel, and self-update/uninstall detection for dbt"
license.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
run_script = { workspace = true }

[dependencies]
async-trait = { workspace = true }
dbt-common = { workspace = true }
dbt-dist-classify = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
dbt-yaml = { workspace = true }

dialoguer = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
console = { workspace = true }
dbt-runtime = { workspace = true }
tokio = { workspace = true }

[lib]
name = "dbt_dist"
path = "src/lib.rs"
doctest = false

kind: Fixes
body: Macro namespace resolution no longer lets an internal search_package shadow
  adapter or root overrides. When search_package is itself an internal package
  (e.g. dbt or dbt_postgres), the adapter override is now consistently preferred
  over the base dbt implementation, and a root-project macro always wins.

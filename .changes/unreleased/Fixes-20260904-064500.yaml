kind: Fixes
body: '`dbt compile --write-catalog` no longer crashes with a `dbt9002` internal error against DuckDB, whose ADBC driver reports the always-NULL `table_owner` column as `Int32` instead of `Utf8`; an all-NULL column is now accepted regardless of its reported Arrow type when a string is expected'

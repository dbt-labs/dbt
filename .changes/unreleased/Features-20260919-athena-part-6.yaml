kind: Features
body: '[Athena] Implement the `AthenaAdapter` methods the dbt-athena macro package calls (`generate_s3_location`, `upload_seed_to_s3`, `delete_from_s3`, `expire_glue_table_versions`, `get_glue_table_type`, `swap_table`, `clean_up_partitions`, `persist_docs_to_glue`, `is_work_group_output_location_enforced`, the partition formatting helpers and `murmur3_hash`, among others) plus `relation.render_hive()` / `render_pure()`, so seeds, views, tables, incremental models and snapshots run on Athena; the adapter response carries dbt-athena's `OK <rows>`, `data_scanned_in_bytes` and the query id'
time: 2026-09-19T10:00:00.000000+02:00

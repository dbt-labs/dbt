kind: Fixes
body: Apply unit-test `overrides.macros` to both the unprefixed and `dbt.`-namespaced spelling of a macro (e.g. `current_timestamp` and `dbt.current_timestamp`), so overriding one freezes both, matching dbt-core. When both spellings are overridden the unprefixed value wins.

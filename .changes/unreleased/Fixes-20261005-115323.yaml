kind: Fixes
body: Fix a 'str' object has no attribute 'year' crash when running a microbatch incremental model with --use-v2-parser and a begin config provided as a string (e.g. via config(begin='2024-01-01')), by coercing it to a datetime after the v2 parser loads the manifest, the same way the native parser already does

kind: Features
body: '[Athena] Add the `athena` profile type: `AthenaDbConfig` mirrors dbt-athena''s `AthenaCredentials`, so Athena profiles parse, expose `target`, and resolve through the experimental-adapter gate and `AthenaAuth`; `parse`/`ls` report the missing `dbt-athena` macro package instead of panicking; `target` exposes `s3_data_dir`, `s3_data_naming` (default `schema_table_unique`), `s3_tmp_table_dir` and `seed_s3_upload_args` for the macros; `assume_role_*`, `endpoint_url`, `poll_interval`, `num_retries` and `num_boto3_retries` reach the driver; `num_iceberg_retries` reruns a query that fails with `ICEBERG_COMMIT_ERROR`, with dbt-athena's random exponential backoff; `spark_work_group` and `lf_tags_database` are accepted for the adapter'
time: 2026-09-10T09:48:50.106146+02:00
